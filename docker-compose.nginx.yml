services:
  pwa_client:
    build:
      context: .
    image: incomudon-pwa-client:latest
    command:
      - -listen
      - :8080
      - -base-path
      - /
    restart: unless-stopped
    environment:
      INCOMUDON_MULTI_MAX_SLOTS: "${INCOMUDON_MULTI_MAX_SLOTS:-10}"
      INCOMUDON_MULTI_DEFAULT_SLOTS: "${INCOMUDON_MULTI_DEFAULT_SLOTS:-4}"
      INCOMUDON_MULTI_PATH: "${INCOMUDON_MULTI_PATH:-}"
      INCOMUDON_DIRECTORY_UDP_LISTEN: "${INCOMUDON_DIRECTORY_UDP_LISTEN:-}"
      INCOMUDON_DIRECTORY_PSK_FILE: "${INCOMUDON_DIRECTORY_PSK_FILE:-}"
      INCOMUDON_DIRECTORY_KEY_ID: "${INCOMUDON_DIRECTORY_KEY_ID:-pwa-1}"
      INCOMUDON_DIRECTORY_UDP_ALLOW_CIDRS: "${INCOMUDON_DIRECTORY_UDP_ALLOW_CIDRS:-}"
    expose:
      - "8080"
    ports:
      - "${PWA_DIRECTORY_UDP_HOST_PORT:-51000}:${PWA_DIRECTORY_UDP_LISTEN_PORT:-51000}/udp"
    volumes:
      - "${INCOMUDON_DIRECTORY_DATA_DIR:-./directory}:/run/incomudon-directory:ro"

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - pwa_client
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
